<script>
"use strict";
/* ---------- helpers ---------- */
/* กันค่าว่าง (null/false) ถูกแสดงเป็นคำว่า "null" ในหน้าจอ */
(function(){ const wrap=k=>{ const o=Element.prototype[k]; Element.prototype[k]=function(...a){ return o.apply(this,a.filter(x=>x!=null&&x!==false)); }; }; wrap('replaceChildren'); wrap('append'); })();
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v===false || v==null) continue;
    if (k==='class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k==='value') el.value = v;
    else if (k==='checked' || k==='disabled' || k==='selected') el[k] = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()){
    if (k==null || k===false) continue;
    el.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return el;
}
const n2 = v => (Number(v)||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const n0 = v => (Number(v)||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const num = v => { const x = parseFloat(String(v).replace(/,/g,'')); return isNaN(x)?0:x; };
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const thDate = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${Number(y)+543}`; };
const uid = () => Math.random().toString(36).slice(2,10);
function toast(msg){ const t=h('div',{class:'toast',role:'status'},msg); document.body.append(t); setTimeout(()=>t.remove(),2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function bahtText(v){
  v = Math.round((Number(v)||0)*100)/100;
  if (v===0) return 'ศูนย์บาทถ้วน';
  const D=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'], P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  function grp(s){ let r=''; const L=s.length;
    for(let i=0;i<L;i++){ const d=+s[i], p=L-i-1; if(!d) continue;
      if(p===0 && d===1 && L>1) r+='เอ็ด';
      else if(p===1 && d===2) r+='ยี่สิบ';
      else if(p===1 && d===1) r+='สิบ';
      else r+=D[d]+P[p]; } return r; }
  function int(n){ let s=String(n), out=''; const parts=[]; while(s.length>6){ parts.unshift(s.slice(-6)); s=s.slice(0,-6);} parts.unshift(s);
    parts.forEach((p,i)=>{ out+=grp(p.replace(/^0+(?=\d)/,'')); if(i<parts.length-1) out+='ล้าน'; }); return out; }
  const baht=Math.floor(v), sat=Math.round((v-baht)*100);
  let r=''; if(baht>0) r+=int(baht)+'บาท';
  r += sat>0 ? int(sat)+'สตางค์' : 'ถ้วน';
  return r;
}

/* ---------- state & storage ---------- */
window.IS_DESKTOP = false;
let db=null;
const S = {items:[],estimates:[],quotes:[],withdrawals:[],moves:[],jobs:[],boms:[],ja:[],po:[],counts:[],settings:null};
const defaultSettings = {company:'ZENSOCON (THAILAND) CO., LTD.',address:'',phone:'',taxId:'',vat:7,qPrefix:'QT',ePrefix:'EST',wPrefix:'WD',jPrefix:'JA',terms:'ชำระเงินมัดจำ 50% เมื่อสั่งซื้อ ส่วนที่เหลือชำระเมื่อส่งมอบงาน\nราคานี้ยังไม่รวมค่าขนส่งนอกพื้นที่ปทุมธานี',validDays:30,signer:'',marginDefault:30,priceMode:'divide'};
let view='home', unsubs=[], loadedTimer=null, ready=false, dbDown=false;

/* ====== ONLINE (Supabase) : persistence ====== */
const CFG=window.QS_CONFIG||{};
let SB=null;
const COLS=['items','estimates','quotes','withdrawals','moves','jobs','boms','ja','po','counts'];
const SNAP={settings:'',folders:''}; COLS.forEach(c=>SNAP[c]=new Map());
const errMsg=e=>(e&&(e.message||e.details||e.code))||String(e);
const mainOf=s=>{ const m={...s}; delete m.bomFolders; return m; };
function lsLoad(){ return null; }
async function dbUpsert(rows){ for(let i=0;i<rows.length;i+=100){ const {error}=await SB.from('records').upsert(rows.slice(i,i+100),{onConflict:'col,id'}); if(error) throw error; } }
async function dbDelete(col,ids){
  for(let i=0;i<ids.length;i+=100){
    const part=ids.slice(i,i+100);
    const {data,error}=await SB.from('records').delete().eq('col',col).in('id',part).select('id'); if(error) throw error;
    if((data||[]).length<part.length){ // แถวหายไปแล้ว หรือไม่มีสิทธิ์ลบ -> ตรวจว่ายังเหลืออยู่ไหม
      const {data:left}=await SB.from('records').select('id').eq('col',col).in('id',part);
      if((left||[]).length) throw new Error('ไม่มีสิทธิ์ลบข้อมูลส่วนนี้');
    }
  }
}
const stampMod=r=>{ r.modAt=new Date().toISOString(); r.modBy=(typeof CU!=='undefined'&&CU&&(CU.name||CU.username))||''; return r; };
async function put(col,id,data){
  if(!allowWrite(col)) return false;
  const rec=stampMod({...data,id});
  try{ await dbUpsert([{col,id,data:rec}]); }catch(e){ toast('บันทึกไม่สำเร็จ: '+errMsg(e)); return false; }
  const arr=S[col]; const i=arr.findIndex(x=>x.id===id); if(i>=0) arr[i]=rec; else arr.push(rec);
  SNAP[col].set(id,JSON.stringify(rec)); render(); return true;
}
async function del(col,id){
  if(!allowWrite(col)) return false;
  try{ await dbDelete(col,[id]); }catch(e){ toast('ลบไม่สำเร็จ: '+errMsg(e)); return false; }

async function putSettings(data){

/* นำเข้า/กู้คืน/จัดโฟลเดอร์ ฯลฯ แก้ข้อมูลในหน่วยความจำก่อน แล้วเรียก lsSave() -> เทียบกับที่ซิงก์ไว้ แล้วส่งเฉพาะที่เปลี่ยน */
let _syncQ=Promise.resolve();
function lsSave(){ _syncQ=_syncQ.then(syncDiff).catch(e=>toast('ซิงก์ข้อมูลขึ้นระบบออนไลน์ไม่สำเร็จ: '+errMsg(e))); return _syncQ; }
async function syncDiff(){
  const up=[], dels=[], marks=[]; let n=0;
  for(const col of COLS){
    const snap=SNAP[col], now=new Map(S[col].map(r=>[r.id,r]));
    for(const [id,r] of now){ let js=JSON.stringify(r); if(snap.get(id)!==js){ stampMod(r); js=JSON.stringify(r); up.push({col,id,data:r}); marks.push([col,id,js]); } }
    const gone=[...snap.keys()].filter(id=>!now.has(id)); if(gone.length) dels.push([col,gone]);
  }
  const s=S.settings||{}, main=JSON.stringify(mainOf(s)), fol=JSON.stringify(s.bomFolders||[]);
  if(main!==SNAP.settings) up.push({col:'settings',id:'main',data:mainOf(s)});
  if(fol!==SNAP.folders) up.push({col:'settings',id:'bomFolders',data:{list:s.bomFolders||[]}});
  if(!up.length&&!dels.length) return;
  if(up.length) await dbUpsert(up);
  for(const [c,ids] of dels){ await dbDelete(c,ids); ids.forEach(id=>SNAP[c].delete(id)); n+=ids.length; }
  marks.forEach(([c,id,js])=>SNAP[c].set(id,js)); SNAP.settings=main; SNAP.folders=fol; n+=up.length;
  if(n>=5) toast('บันทึกขึ้นระบบออนไลน์แล้ว '+n0(n)+' รายการ');
}
async function loadAll(){
  const fetchCol=async col=>{ let out=[], from=0; for(;;){
    const {data,error}=await SB.from('records').select('id,data').eq('col',col).order('id').range(from,from+999); if(error) throw error;
    out=out.concat(data); if(data.length<1000) break; from+=1000; } return out; };
  const res=await Promise.all([...COLS.map(c=>fetchCol(c)),fetchCol('settings')]);
  COLS.forEach((c,i)=>{ S[c]=res[i].map(r=>({...r.data,id:r.id})); SNAP[c]=new Map(S[c].map(r=>[r.id,JSON.stringify(r)])); });
  const st=res[COLS.length]; const m=st.find(r=>r.id==='main'), f=st.find(r=>r.id==='bomFolders');
  S.settings={...defaultSettings,...(m?m.data:{}),bomFolders:(f&&f.data&&f.data.list)||[]};
  SNAP.settings=JSON.stringify(mainOf(S.settings)); SNAP.folders=JSON.stringify(S.settings.bomFolders);
}
/* ---------- realtime ---------- */
let _rtT=0, _rtFirst=true;
function laterRender(){ clearTimeout(_rtT); _rtT=setTimeout(()=>{ const a=document.activeElement, mn=document.querySelector('#main');
  if(a&&mn&&mn.contains(a)&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)){ laterRender(); return; } buildRail(); render(); },600); }
function applyRemote(col,id,data){
  if(col==='settings'){
    if(id==='main'){ const s={...defaultSettings,...data,bomFolders:(S.settings||{}).bomFolders||[]}; const js=JSON.stringify(mainOf(s)); if(js===SNAP.settings) return; S.settings=s; SNAP.settings=js; }
    else if(id==='bomFolders'){ const l=(data&&data.list)||[]; const js=JSON.stringify(l); if(js===SNAP.folders) return; S.settings={...S.settings,bomFolders:l}; SNAP.folders=js; }
    laterRender(); return;
  }
  if(!S[col]) return; const snap=SNAP[col];
  if(data===null){ if(!snap.has(id)) return; S[col]=S[col].filter(r=>r.id!==id); snap.delete(id); }
  else { const rec={...data,id}; const js=JSON.stringify(rec); if(snap.get(id)===js) return; const i=S[col].findIndex(r=>r.id===id); if(i>=0) S[col][i]=rec; else S[col].push(rec); snap.set(id,js); }
  laterRender();
}
function subscribeRT(){
  SB.channel('records-rt').on('postgres_changes',{event:'*',schema:'public',table:'records'},p=>{
    if(p.eventType==='DELETE'){ const o=p.old||{}; if(o.col&&o.id) applyRemote(o.col,o.id,null); }
    else if(p.new&&p.new.col) applyRemote(p.new.col,p.new.id,p.new.data);
  }).subscribe(async st=>{
    if(st==='SUBSCRIBED'){ if(_rtFirst){ _rtFirst=false; return; } try{ await loadAll(); laterRender(); toast('เชื่อมต่อใหม่ ดึงข้อมูลล่าสุดแล้ว'); }catch(e){} }
  });
}

/* ---------- calculations ---------- */
function modDate(x){ if(!x) return ''; const d=new Date(x); if(isNaN(d)) return String(x).slice(0,10); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+(d.getFullYear()+543)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function minPrice(it){ const p=(it.suppliers||[]).map(s=>num(s.price)).filter(x=>x>0); return p.length?Math.min(...p):0; }
function sellPrice(cost,m){
  m=Math.max(0,num(m));
  if((S.settings&&S.settings.priceMode)==='multiply') return cost*(1+m/100);
  return cost/(1-Math.min(m,95)/100);
}
function estToQuote(d,lump){
  const c=estCalc(d); const k=c.material>0?c.price/c.material:1;
  const q={no:nextNo(S.settings.qPrefix,S.quotes),date:today(),validDays:num(S.settings.validDays)||30,customer:d.customer,contact:'',address:'',project:d.project,
    lines:d.lines.map(l=>({desc:l.name,qty:num(l.qty),unit:l.unit,price:Math.round(num(l.cost)*k*100)/100})),
    discount:0,vatOn:true,terms:S.settings.terms,note:'',status:'draft',estimateId:d.id};
  if(c.material<=0) q.lines=[{desc:d.project||'งานตามใบประมาณราคา',qty:1,unit:'งาน',price:Math.round(c.price*100)/100}];
  if(lump){ q.lumpMode=true; q.lump=Math.round(c.price*100)/100; }
  return q;
}

  const bg=h('div',{class:'modal-bg',style:'z-index:60;align-items:center'});
  const done=()=>bg.remove();
  const list=[...S.estimates].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  bg.append(h('div',{class:'modal',role:'dialog','aria-label':'เลือกใบประมาณราคา',style:'width:min(640px,100%)'},
    h('h2',null,'ดึงข้อมูลจากใบประมาณราคา'),

      h('td',null,h('button',{class:'btn small primary',onclick:()=>{done();onPick(e);}},'เลือก')))))):h('div',{class:'empty'},'ยังไม่มีใบประมาณราคา'),
    h('footer',null,h('button',{class:'btn',onclick:done},'ยกเลิก'))));
  document.body.append(bg);

function priceFactor(m){ return sellPrice(1,m); }
function estCalc(e){
  const material = (e.lines||[]).reduce((a,l)=>a+num(l.qty)*num(l.cost),0);
  const labor = num(e.labor);
  const overhead = (material+labor)*num(e.overheadPct)/100;
  const cost = material+labor+overhead;
  const price = sellPrice(cost, e.marginPct);
  return {material,labor,overhead,cost,price,profit:price-cost};
}
function quoteCalc(q){
  const sub = q.lumpMode ? num(q.lump) : (q.lines||[]).reduce((a,l)=>a+num(l.qty)*num(l.price),0);
  const disc = Math.min(num(q.discount), sub);
  const net = sub-disc;
  const vatRate = q.vatOn===false ? 0 : num(S.settings?.vat ?? 7);
  const vat = net*vatRate/100;
  return {sub,disc,net,vat,vatRate,total:net+vat};
}
function nextNo(prefix, list){
  const d=new Date(); const ym = String(d.getFullYear()+543).slice(-2)+String(d.getMonth()+1).padStart(2,'0');
  const head = `${prefix}-${ym}-`;
  const mx = list.filter(x=>(x.no||'').startsWith(head)).map(x=>parseInt(x.no.slice(head.length))||0);
  return head + String((mx.length?Math.max(...mx):0)+1).padStart(3,'0');
}

const CAT_PREFIX={"03": "ไฟฟ้า › วัสดุสิ้นเปลืองไฟฟ้า", "05": "ไฟฟ้า › สายไฟ / สายสัญญาณ", "06": "ไฟฟ้า › เซนเซอร์ / เครื่องวัด", "11": "เครื่องกล › แมคคานิค / พาร์ทเครื่อง", "13": "เครื่องกล › นิวเมติกส์ / ไฮดรอลิค", "14": "เครื่องกล › เครื่องมือ / วัสดุสิ้นเปลืองงานช่าง", "16": "เครื่องกล › วาล์ว / ท่อ / ปั๊ม", "21": "เครื่องกล › นิวเมติกส์ / ไฮดรอลิค", "25": "ค่าแรง › งานจ้าง / บริการ"};

const CAT_GROUPS=['ไฟฟ้า','เครื่องกล','ค่าแรง','อื่นๆ'];
const CAT_ICON={'ไฟฟ้า':'⚡ ','เครื่องกล':'🔧 ','ค่าแรง':'👷 ','อื่นๆ':'📦 '};
const catNorm=c=>{ c=String(c||'').trim(); if(c.startsWith('งานไฟฟ้า › ')) c='ไฟฟ้า › '+c.slice(11); if(c==='เครื่องกล › งานจ้าง / บริการ') c='ค่าแรง › งานจ้าง / บริการ'; return c; };
let _catRx=null;
function autoCat(code,name){
  if(!_catRx) _catRx=CAT_RULES.map(([l,p])=>[l,new RegExp(p,'i')]);
  const n=String(name||'');
  for(const [l,rx] of _catRx) if(rx.test(n)) return l;
  const m=String(code||'').match(/^(\d{2})\d{7}/); if(m&&CAT_PREFIX[m[1]]) return CAT_PREFIX[m[1]];
  return '';
}
const catGroup=c=>{ c=catNorm(c); const g=c.split(' › ')[0]; return CAT_GROUPS.includes(g)?g:(c?'อื่นๆ':'ยังไม่จัดหมวด'); };
const catOf=l=>catNorm(l.cat||(l.itemId&&(S.items.find(i=>i.id===l.itemId)||{}).category)||'');
const catLabel=c=>{ c=catNorm(c); if(!c) return 'ยังไม่จัดหมวด'; const g=catGroup(c); return (CAT_ICON[g]||'')+(CAT_LIST.includes(c)||g!=='อื่นๆ'?c:'อื่นๆ › '+c); };
function catRank(c){ c=catNorm(c); if(!c) return 99999; const i=CAT_LIST.indexOf(c); return CAT_GROUPS.indexOf(catGroup(c))*1000+(i>=0?i:500); }
function catSections(lines){
  const m=new Map(); lines.forEach(l=>{ const c=catOf(l); (m.get(c)||m.set(c,[]).get(c)).push(l); });
  return [...m].sort((a,b)=>catRank(a[0])-catRank(b[0])||String(a[0]).localeCompare(String(b[0]),'th')).map(([cat,lines])=>({cat,lines}));
}
const catRow=(c,span)=>h('tr',null,h('td',{colspan:span,style:'background:#eef2f7;font-weight:600;padding:4px 10px'},catLabel(c)));

const logTs=t=>{ const d=new Date(t); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes()); };
const logBy=()=>(CU&&(CU.name||CU.username))||'';
const logAdd=(arr,text)=>[{ts:Date.now(),by:logBy(),text},...(arr||[])].slice(0,100);
function itemDiff(a,b){
  const out=[]; const sh=v=>(v===''||v==null)?'-':String(v);
  ITEM_FIELDS.forEach(([k,l])=>{ let va=a[k],vb=b[k]; if(k==='cost'||k==='stock'||k==='min'){ va=num(va); vb=num(vb); } if(k==='category'){ va=catNorm(va).split(' › ').pop(); vb=catNorm(vb).split(' › ').pop(); } if(sh(va)!==sh(vb)) out.push(l+': '+sh(va)+' → '+sh(vb)); });
  const sp=x=>JSON.stringify((x||[]).map(z=>[z.name,String(z.price)])); if(sp(a.suppliers)!==sp(b.suppliers)) out.push('ราคาจากร้าน ('+((b.suppliers||[]).length)+' ร้าน)');
  return out;
}

async function saveFile(filename,data){
  try{
    const mt={html:'text/html;charset=utf-8',csv:'text/csv;charset=utf-8',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pdf:'application/pdf'}[(filename.split('.').pop()||'').toLowerCase()]||'text/plain;charset=utf-8';
    const blob=new Blob([data],{type:mt});
    if(window.flutter_inappwebview&&window.flutter_inappwebview.callHandler){ const b64=await new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]||''); r.onerror=no; r.readAsDataURL(blob); }); await window.flutter_inappwebview.callHandler('saveFile',filename,b64,mt); return; }
    if(!window.IS_DESKTOP&&/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.share){ /* มือถือ: เปิดหน้าต่างแชร์ (บันทึกลงไฟล์ / LINE / อีเมล) */
      try{ const f=new File([blob],filename,{type:mt}); if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:filename}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){ toast('บันทึกไฟล์ไม่สำเร็จ'); }
}

    onclick:e=>{ const bg=e.currentTarget; if(bgDown&&e.target===bg&&e.clientX<bg.clientWidth&&e.clientY<bg.clientHeight) closeModal(); bgDown=false; }},m));

/* in-app confirm dialog (native confirm() can freeze text inputs in the desktop window) */
function ask(msg,okLabel='ยืนยัน'){
  return new Promise(res=>{
    const bg=h('div',{class:'modal-bg',style:'z-index:60;align-items:center'});
    const done=v=>{ bg.remove(); res(v); };
    bg.append(h('div',{class:'modal',role:'alertdialog','aria-label':msg,style:'width:min(420px,100%)'},
      h('p',{style:'margin:0 0 6px;font-size:16px'},msg),
      h('footer',null,h('button',{class:'btn',onclick:()=>done(false)},'ยกเลิก'),h('button',{class:'btn primary',id:'askok',onclick:()=>done(true)},okLabel))));
    document.body.append(bg); setTimeout(()=>{ const b=$('#askok'); if(b) b.focus(); },0);
  });
}

const BKIND={mechanic:'เครื่องกล',electric:'ไฟฟ้า / คอนโทรล',other:'อื่นๆ'};
const BBUCKET={1:'มีของในสต็อก',2:'ไม่มีของในสต็อก',3:'สินค้าต้องสั่ง'};
/* สถานะอัตโนมัติ: 1 มีของพอในสต็อก / 2 มีในฐานข้อมูลแต่ของไม่พอหรือหมด / 3 ไม่มีในฐานข้อมูล = ต้องสั่ง */
function bomAutoBucket(l,q){
  const code=String(l.code||'').trim().toLowerCase(), nm=String(l.name||'').trim().toLowerCase();
  const it=(code&&S.items.find(i=>String(i.code||'').trim().toLowerCase()===code))||(nm&&S.items.find(i=>String(i.name||'').trim().toLowerCase()===nm));
  if(!it) return 3; return num(it.stock)>=(q>0?q:1)?1:2;
}
const BFN={
  ROUNDUP:(x,d=0)=>{const m=Math.pow(10,d);return Math.sign(x)*Math.ceil(Math.abs(x)*m-1e-9)/m;},
  ROUNDDOWN:(x,d=0)=>{const m=Math.pow(10,d);return Math.sign(x)*Math.floor(Math.abs(x)*m+1e-9)/m;},
  ROUND:(x,d=0)=>{const m=Math.pow(10,d);return Math.sign(x)*Math.round(Math.abs(x)*m+1e-9)/m;},
  CEILING:(x,s=1)=>s?Math.ceil(x/s-1e-9)*s:0, FLOOR:(x,s=1)=>s?Math.floor(x/s+1e-9)*s:0,
  IF:(c,a,b=0)=>c?a:b, MAX:Math.max, MIN:Math.min, ABS:Math.abs, INT:Math.floor, SQRT:Math.sqrt, POWER:Math.pow, PI:()=>Math.PI,
  SUM:(...a)=>a.flat().reduce((s,v)=>s+(Number(v)||0),0), AND:(...a)=>a.every(Boolean), OR:(...a)=>a.some(Boolean), NOT:x=>!x
};
const _bcache=new Map();
/* ตัวอ่านสูตรเขียนเอง (ไม่ใช้ eval / new Function เพราะหน้าต่างโปรแกรมบล็อกไว้) */
function bomParse(src){
  const toks=[]; const re=/\s*(?:(\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+)|([A-Za-z_][A-Za-z0-9_]*)|(\*\*|<=|>=|<>|!=|==|&&|\|\||[-+*\/^()<>=,&|]))/y;
  let m,pos=0; src=src.trim();
  while(pos<src.length){ re.lastIndex=pos; m=re.exec(src); if(!m) throw new Error('อักขระไม่รองรับ'); pos=re.lastIndex;
    if(m[1]!==undefined) toks.push({t:'n',v:parseFloat(m[1])}); else if(m[2]!==undefined) toks.push({t:'i',v:m[2]}); else toks.push({t:'o',v:m[3]}); }
  let i=0; const ids=new Set();
  const peek=()=>toks[i], eat=v=>{ const t=toks[i]; if(t&&t.t==='o'&&t.v===v){ i++; return true; } return false; };
  function orE(){ let l=andE(); while(peek()&&peek().t==='o'&&(peek().v==='||'||peek().v==='|')){ i++; const r=andE(), a=l; l=e=>(a(e)||r(e))?1:0; } return l; }
  function andE(){ let l=cmpE(); while(peek()&&peek().t==='o'&&(peek().v==='&&'||peek().v==='&')){ i++; const r=cmpE(), a=l; l=e=>(a(e)&&r(e))?1:0; } return l; }
  function cmpE(){ let l=addE(); const t=peek(); if(t&&t.t==='o'&&['<','>','<=','>=','=','==','<>','!='].includes(t.v)){ i++; const r=addE(), a=l, o=t.v;
      return e=>{ const x=a(e), y=r(e); return (o==='<'?x<y:o==='>'?x>y:o==='<='?x<=y:o==='>='?x>=y:(o==='='||o==='==')?x===y:x!==y)?1:0; }; } return l; }
  function addE(){ let l=mulE(); for(;;){ const t=peek(); if(t&&t.t==='o'&&(t.v==='+'||t.v==='-')){ i++; const r=mulE(), a=l; l=t.v==='+'?(e=>a(e)+r(e)):(e=>a(e)-r(e)); } else return l; } }
  function mulE(){ let l=powE(); for(;;){ const t=peek(); if(t&&t.t==='o'&&(t.v==='*'||t.v==='/')){ i++; const r=powE(), a=l; l=t.v==='*'?(e=>a(e)*r(e)):(e=>a(e)/r(e)); } else return l; } }
  function powE(){ let l=unE(); for(;;){ const t=peek(); if(t&&t.t==='o'&&(t.v==='^'||t.v==='**')){ i++; const r=unE(), a=l; l=e=>Math.pow(a(e),r(e)); } else return l; } }
  function unE(){ if(eat('-')){ const x=unE(); return e=>-x(e); } if(eat('+')) return unE(); return prim(); }
  function prim(){ const t=toks[i++]; if(!t) throw new Error('สูตรไม่ครบ');
    if(t.t==='n') return ()=>t.v;
    if(t.t==='o'&&t.v==='('){ const x=orE(); if(!eat(')')) throw new Error('ขาดวงเล็บปิด'); return x; }
    if(t.t==='i'){ const name=t.v;
      if(eat('(')){ const args=[]; if(!eat(')')){ do{ args.push(orE()); }while(eat(',')); if(!eat(')')) throw new Error('ขาดวงเล็บปิด'); }
        if(!Object.prototype.hasOwnProperty.call(BFN,name.toUpperCase())) throw new Error('ไม่รู้จักฟังก์ชัน '+name);
        const f=BFN[name.toUpperCase()]; return e=>f(...args.map(a=>a(e))); }
      if(name==='true'||name==='TRUE') return ()=>1; if(name==='false'||name==='FALSE') return ()=>0;
      ids.add(name); return e=>e[name]; }
    throw new Error('สูตรไม่ถูกต้อง'); }
  const f=orE(); if(i<toks.length) throw new Error('สูตรไม่ถูกต้อง');

function bomCompile(raw){
  let c=_bcache.get(raw); if(c) return c;
  try{
    let s=String(raw).replace(/^\s*=/,'').trim();
    if(!s) throw new Error('สูตรว่าง');
    s=s.replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
    c=bomParse(s);
  }catch(e){ c={err:e.message||'สูตรไม่ถูกต้อง'}; }
  _bcache.set(raw,c); return c;
}
function bomCalc(b){
  const P={}; (b.params||[]).forEach(p=>{ P[p.key]=num(p.value); });
  const byRef=new Map(); (b.lines||[]).forEach(l=>byRef.set(l.ref,l));
  const memo=new Map(), stack=new Set();
  function ev(expr){
    if(typeof expr==='number') return {v:expr};
    const raw=String(expr==null?'':expr).trim();
    if(raw==='') return {v:0};
    if(raw[0]!=='='){ const x=Number(raw.replace(/,/g,'')); return isNaN(x)?{v:0,err:'ไม่ใช่ตัวเลข'}:{v:x}; }
    const c=bomCompile(raw); if(c.err) return {v:0,err:c.err};
    const env={};
    for(const id of c.ids){
      if(Object.prototype.hasOwnProperty.call(P,id)) env[id]=P[id];
      else if(/^Q\d+$/.test(id)){
        const tl=byRef.get(+id.slice(1)); if(!tl) return {v:0,err:'ไม่พบบรรทัด '+id};
        const r=qtyOf(tl); if(r.err) return {v:0,err:'ขึ้นกับ '+id+' ที่มีปัญหา'}; env[id]=r.v;
      } else return {v:0,err:'ไม่รู้จัก '+id};
    }
    try{ let v=c.run(env); if(typeof v==='boolean') v=v?1:0; if(typeof v!=='number'||!isFinite(v)) return {v:0,err:'คำนวณไม่ได้'}; return {v}; }
    catch(e){ return {v:0,err:'คำนวณไม่ได้'}; }
  }
  function qtyOf(l){
    if(memo.has(l)) return memo.get(l);
    if(stack.has(l)) return {v:0,err:'อ้างอิงวนกลับ'};
    stack.add(l); const r=ev(l.qty); stack.delete(l); memo.set(l,r); return r;
  }
  const buckets={1:0,2:0,3:0}; let sub=0;
  const lines=(b.lines||[]).map(l=>{
    const q=qtyOf(l), p=ev(l.price), t=q.v*p.v, bk=[1,2,3].includes(+l.bucket)?+l.bucket:1;
    sub+=t; buckets[bk]+=t; return {q:q.v,p:p.v,t,qe:q.err,pe:p.err,bucket:bk};
  });
  const reserve=num(b.reserve), units=num(b.units)||1, withReserve=sub*(1+reserve);
  return {lines,sub,buckets,reserve,withReserve,units,total:withReserve*units,errs:lines.filter(x=>x.qe||x.pe).length};
}

function whAdj(str,k,delta){ const a=whParse(str); let r=a.find(x=>x.k===k); if(!r){ if(delta<=0) return str||''; r={k,q:0}; a.push(r); } r.q=Math.max(0,+(r.q+delta).toFixed(4)); return a.map(x=>x.k+':'+x.q).join(';'); }
function whDefault(it,qty){ const l=whList(it).sort((a,b)=>b.q-a.q); const f=l.find(w=>w.q>=qty)||l[0]; return f?f.k:''; }

function stockMove(it,delta,wh,logText){
  const rec={...strip(it),stock:Math.max(0,+(num(it.stock)+delta).toFixed(4))};
  if(wh){ if(it.stockWh) rec.stockWh=whAdj(it.stockWh,wh,delta); else if(num(it.stock)<=0&&delta>0) rec.stockWh=wh+':'+delta; }
  else if(it.stockWh){ const k=whBig(it); if(k) rec.stockWh=whAdj(it.stockWh,k,delta); }
  if(logText) rec.log=logAdd(it.log,logText);
  return rec;
}

/* ---------- สแกน QR / บาร์โค้ด + ป้าย QR ---------- */
function loadJs(src){ return new Promise((ok,no)=>{ if(document.querySelector('script[data-j="'+src+'"]')) return ok(); const s=document.createElement('script'); s.src=src; s.dataset.j=src; s.onload=ok; s.onerror=()=>no(new Error(src)); document.head.append(s); }); }
async function scanModal(onCode){
  let stream=null, stop=false, raf=0;
  const vid=h('video',{playsinline:true,muted:true,style:'width:100%;max-height:55vh;background:#000;border-radius:8px'});
  const msg=h('div',{class:'hint',style:'margin-top:6px'},'เล็งกล้องไปที่ QR / บาร์โค้ดของวัสดุ');
  const end=()=>{ stop=true; cancelAnimationFrame(raf); if(stream) stream.getTracks().forEach(t=>t.stop()); };
  const done=c=>{ end(); closeModal(); onCode(String(c).trim()); };
  const man=h('input',{placeholder:'หรือพิมพ์รหัสวัสดุ แล้วกด Enter','aria-label':'รหัสวัสดุ',onkeydown:e=>{ if(e.key==='Enter'&&e.target.value.trim()) done(e.target.value); }});
  openModal('สแกนวัสดุ',h('div',null,vid,msg,h('div',{style:'margin-top:8px'},man)),[h('button',{class:'btn',onclick:()=>{ end(); closeModal(); }},'ปิด')]);
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); vid.srcObject=stream; await vid.play();
    const det=('BarcodeDetector' in window)?new BarcodeDetector():null; if(!det) await loadJs('vendor/jsqr.js');
    const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
    const tick=async()=>{ if(stop) return; if(!document.body.contains(vid)){ end(); return; }
      try{ if(vid.readyState>=2){ let v=''; if(det){ const r=await det.detect(vid); if(r[0]) v=r[0].rawValue; } else { cv.width=vid.videoWidth; cv.height=vid.videoHeight; cx.drawImage(vid,0,0); const im=cx.getImageData(0,0,cv.width,cv.height); const r=window.jsQR&&jsQR(im.data,im.width,im.height); if(r) v=r.data; } if(v){ done(v); return; } } }catch(e){}
      raf=requestAnimationFrame(tick); };
    tick();
  }catch(e){ msg.textContent='เปิดกล้องไม่ได้ ('+(e&&e.name||'')+') — พิมพ์รหัสด้านล่างแทนได้'; }
}
function scanItem(cb){ scanModal(code=>{ const c=String(code).trim().toLowerCase(); const it=S.items.find(i=>String(i.code||'').trim().toLowerCase()===c)||S.items.find(i=>i.id===code)||S.items.find(i=>String(i.name||'').trim().toLowerCase()===c); if(it) cb(it); else toast('ไม่พบวัสดุรหัส "'+code+'"'); }); }
async function labelPrint(items){
